<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
	:root { --bg:#0b0908; --red:#e5483c; --fg:#d8cfc7; --dim:#8a7e76; --line:#2a1f1a; color-scheme:dark; }
	* { margin:0; box-sizing:border-box; }
	body { width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);
		font-family:'JetBrains Mono',ui-monospace,monospace; display:flex; flex-direction:column; }
	a { color:inherit; text-decoration:none; }

	.top { display:flex; align-items:center; gap:3ch; height:58px; padding:0 48px; font-size:13px; flex:none; }
	.wordmark { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
	.wordmark b { color:var(--red); font-weight:700; }
	.back { color:var(--dim); }
	.src { margin-left:auto; color:var(--dim); }

	.stage { flex:1; display:grid; place-items:center; position:relative; }
	.ghost { position:absolute; top:-10px; right:70px; font-size:340px; font-weight:800; line-height:1; letter-spacing:-0.05em;
		color:transparent; -webkit-text-stroke:1px var(--red); mix-blend-mode:difference; pointer-events:none; user-select:none; }

	.plate { position:relative; text-align:center; }
	.frame { width:600px; aspect-ratio:4/3; margin:0 auto; border:1px solid var(--line); outline:1px solid var(--line); outline-offset:6px; }
	.caption { margin-top:30px; display:flex; align-items:center; justify-content:center; gap:22px; }
	.chip { width:56px; height:56px; background:var(--red); color:var(--bg); display:grid; place-items:center; font-size:22px; font-weight:700; }
	.name { font-size:34px; font-weight:700; letter-spacing:-0.035em; }
	.suffix { font-size:14px; color:var(--dim); }

	.scene { width:190px; height:190px; perspective:900px; margin:0 auto; position:relative; top:50%; transform:translateY(-50%); }
	.cube { width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:spin 26s linear infinite; }
	.cube i { position:absolute; inset:0; border:1px solid var(--red); background:rgba(229,72,60,0.06); }
	.cube i:nth-child(1) { transform:translateZ(95px); }
	.cube i:nth-child(2) { transform:rotateY(180deg) translateZ(95px); }
	.cube i:nth-child(3) { transform:rotateY(90deg) translateZ(95px); }
	.cube i:nth-child(4) { transform:rotateY(-90deg) translateZ(95px); }
	.cube i:nth-child(5) { transform:rotateX(90deg) translateZ(95px); }
	.cube i:nth-child(6) { transform:rotateX(-90deg) translateZ(95px); }
	@keyframes spin { to { transform:rotateX(360deg) rotateY(360deg); } }
	@media (prefers-reduced-motion: reduce) { .cube { animation:none; transform:rotateX(-20deg) rotateY(30deg); } }

	.status { flex:none; display:flex; gap:3ch; align-items:center; border-top:1px solid var(--line); padding:14px 48px 18px; font-size:13px; color:var(--dim); }
	.status span:last-child { margin-left:auto; }
</style>
</head>
<body>
	<span class="ghost" aria-hidden="true">01</span>

	<div class="top">
		<a class="wordmark" href="/">pixijs-<b>3d</b>-labs</a>
		<a class="back" href="/">← index</a>
		<a class="src" href="https://github.com/daniheras">source ↗</a>
	</div>

	<div class="stage">
		<div class="plate">
			<div class="frame">
				<div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
			</div>
			<div class="caption">
				<span class="chip">01</span>
				<span class="name">hello-cube</span>
				<span class="suffix">3d · view3d · beta</span>
			</div>
		</div>
	</div>

	<div class="status">
		<span>lab: 01 · status: beta</span>
		<a href="https://github.com/daniheras">github ↗</a>
	</div>
</body>
</html>
