<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
	:root { --bg:#0b0908; --red:#e5483c; --red-bright:#ff5f4d; --fg:#d8cfc7; --dim:#8a7e76; --line:#2a1f1a; color-scheme:dark; }
	* { margin:0; box-sizing:border-box; }
	body { width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);
		font-family:'JetBrains Mono',ui-monospace,monospace; display:flex; flex-direction:column; }
	a { color:inherit; text-decoration:none; }

	/* the standing index row, inverted */
	.band { flex:none; background:var(--red); display:flex; align-items:center; gap:36px; padding:30px 48px; }
	.chip { flex:none; width:76px; height:76px; background:var(--bg); color:var(--red-bright); display:grid; place-items:center; font-size:28px; font-weight:700; }
	.name { font-size:72px; font-weight:700; letter-spacing:-0.035em; line-height:1; color:var(--bg); }
	.suffix { font-size:16px; color:rgba(11,9,8,0.92); }
	.cursor { width:0.55em; height:1em; margin-left:1ch; background:var(--bg); animation:blink 1.1s steps(1) infinite; }
	@keyframes blink { 50% { opacity:0; } }
	@media (prefers-reduced-motion: reduce) { .cursor { animation:none; } }
	.band .nav { margin-left:auto; display:flex; gap:3ch; font-size:13px; }
	.band .nav a { color:var(--bg); }

	/* the demo, red-ruled */
	.demo { flex:1; display:grid; place-items:center; }
	.frame { width:640px; aspect-ratio:4/3; border:1px solid var(--red); }

	.scene { width:200px; height:200px; perspective:900px; }
	.cube { width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:spin 26s linear infinite; }
	.cube i { position:absolute; inset:0; border:1px solid var(--red); background:rgba(229,72,60,0.06); }
	.cube i:nth-child(1) { transform:translateZ(100px); }
	.cube i:nth-child(2) { transform:rotateY(180deg) translateZ(100px); }
	.cube i:nth-child(3) { transform:rotateY(90deg) translateZ(100px); }
	.cube i:nth-child(4) { transform:rotateY(-90deg) translateZ(100px); }
	.cube i:nth-child(5) { transform:rotateX(90deg) translateZ(100px); }
	.cube i:nth-child(6) { transform:rotateX(-90deg) translateZ(100px); }
	@keyframes spin { to { transform:rotateX(360deg) rotateY(360deg); } }
	@media (prefers-reduced-motion: reduce) { .cube { animation:none; transform:rotateX(-20deg) rotateY(30deg); } }

	.status { flex:none; display:flex; gap:3ch; align-items:center; border-top:1px solid var(--line); padding:14px 48px 18px; font-size:13px; color:var(--dim); }
	.status span:last-child { margin-left:auto; }
</style>
</head>
<body>
	<div class="band">
		<span class="chip">01</span>
		<span class="name">hello-cube</span>
		<span class="suffix">3d · view3d · beta</span>
		<span class="cursor" aria-hidden="true"></span>
		<span class="nav">
			<a href="/">← index</a>
			<a href="https://github.com/daniheras">source ↗</a>
		</span>
	</div>

	<div class="demo">
		<div class="frame">
			<div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
		</div>
	</div>

	<div class="status">
		<span>lab: 01 · status: beta</span>
		<span>webgpu-first · webgl fallback</span>
		<a href="https://github.com/daniheras">github ↗</a>
	</div>
</body>
</html>
