<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
	:root { --bg:#0b0908; --red:#e5483c; --fg:#d8cfc7; --dim:#8a7e76; --line:#2a1f1a; color-scheme:dark; }
	* { margin:0; box-sizing:border-box; }
	body { width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--fg);
		font-family:'JetBrains Mono',ui-monospace,monospace; display:flex; flex-direction:column; }
	a { color:inherit; text-decoration:none; }

	.top { display:flex; align-items:center; gap:3ch; height:58px; padding:0 48px; border-bottom:1px solid var(--line); font-size:13px; flex:none; }
	.wordmark { font-size:15px; font-weight:700; letter-spacing:-0.02em; }
	.wordmark b { color:var(--red); font-weight:700; }
	.back { color:var(--dim); }
	.src { margin-left:auto; color:var(--dim); }

	.bench { flex:1; display:grid; place-items:center; }
	.frame { width:700px; aspect-ratio:4/3; position:relative; border:1px solid var(--line); }
	.tick { position:absolute; width:18px; height:18px; border:0 solid var(--red); }
	.tl { top:-1px; left:-1px; border-top-width:1px; border-left-width:1px; }
	.tr { top:-1px; right:-1px; border-top-width:1px; border-right-width:1px; }
	.bl { bottom:-1px; left:-1px; border-bottom-width:1px; border-left-width:1px; }
	.br { bottom:-1px; right:-1px; border-bottom-width:1px; border-right-width:1px; }
	.tag { position:absolute; left:14px; bottom:12px; font-size:12px; color:var(--dim); }

	.scene { width:220px; height:220px; perspective:900px; }
	.cube { width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:spin 26s linear infinite; }
	.cube i { position:absolute; inset:0; border:1px solid var(--red); background:rgba(229,72,60,0.06); }
	.cube i:nth-child(1) { transform:translateZ(110px); }
	.cube i:nth-child(2) { transform:rotateY(180deg) translateZ(110px); }
	.cube i:nth-child(3) { transform:rotateY(90deg) translateZ(110px); }
	.cube i:nth-child(4) { transform:rotateY(-90deg) translateZ(110px); }
	.cube i:nth-child(5) { transform:rotateX(90deg) translateZ(110px); }
	.cube i:nth-child(6) { transform:rotateX(-90deg) translateZ(110px); }
	@keyframes spin { to { transform:rotateX(360deg) rotateY(360deg); } }
	@media (prefers-reduced-motion: reduce) { .cube { animation:none; transform:rotateX(-20deg) rotateY(30deg); } }

	.status { flex:none; display:flex; gap:3ch; align-items:center; border-top:1px solid var(--line); padding:14px 48px 18px; font-size:13px; color:var(--dim); }
	.status span:last-child { margin-left:auto; }
</style>
</head>
<body>
	<div class="top">
		<a class="wordmark" href="/">pixijs-<b>3d</b>-labs</a>
		<a class="back" href="/">← index</a>
		<a class="src" href="https://github.com/daniheras">source ↗</a>
	</div>

	<div class="bench">
		<div class="frame">
			<span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
			<div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
			<span class="tag">4:3 · live</span>
		</div>
	</div>

	<div class="status">
		<span>lab: 01 · hello-cube · status: beta</span>
		<span>webgpu-first · webgl fallback</span>
		<a href="https://github.com/daniheras">github ↗</a>
	</div>
</body>
</html>
